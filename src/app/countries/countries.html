<div class="container mb-sm-5">
  <!-- Navbar -->
  <div class="d-flex justify-content-center">
    <nav class="navbar navbar-expand-lg bg-body-secondary w-50 rounded-top">
      <div class="container-fluid d-flex justify-content-between">
        <a class="navbar-brand">Country List</a>

        <form class="d-flex" role="search">
          <span>Country Search: </span>
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
           [ngModel]="countryName()"
           (ngModelChange)="countryName.set($event); search()"
           [ngModelOptions]="{standalone: true}" />
        </form>
      </div>
    </nav>
  </div>

  <!-- List Group -->
  <div class="d-flex justify-content-center">
    <div class="list-group w-50 rounded-bottom mb-0">
      @for (country of (countryList()); track $index) {
      <a href="#" class="list-group-item list-group-item-action " aria-current="true">
        <div class="d-flex w-100 justify-content-between">
          <h5 class="mb-1">{{country.name.common}}</h5>
          <div>
            @for (currency of country.currencies | keyvalue; track currency.key) {
              <small>{{ currency.value.symbol }}</small>
            }
          </div>
        </div>
        <p class="mb-1">{{country.name.official}}</p>
        <small>{{country.capital?.[0]}}</small>
      </a>
      }

    </div>
  </div>
</div>
