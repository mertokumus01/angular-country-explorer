<div class="container mb-sm-5">
  <!-- Navbar -->
  <div class="d-flex justify-content-center">
    <nav class="navbar navbar-expand-lg bg-body-secondary w-50 rounded-top">
      <div class="container-fluid d-flex justify-content-between">
        <a class="navbar-brand">Country List</a>

        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
      </div>
    </nav>
  </div>

  <!-- List Group -->
  <div class="d-flex justify-content-center">
    <div class="list-group w-50 rounded-bottom mb-0">
      @for (country of (countryList | async)?? []; track $index) {
      <a href="#" class="list-group-item list-group-item-action active" aria-current="true">
        <div class="d-flex w-100 justify-content-between">
          <h5 class="mb-1">{{country.name}}</h5>
          <small>3 days ago</small>
        </div>
        <p class="mb-1">Some placeholder content in a paragraph.</p>
        <small>And some small print.</small>
      </a>
      }

    </div>
  </div>
</div>
